<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Procedural Glitch Background</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: #eaeaea;
      overflow: hidden;
    }

    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      z-index: -1;
    }

    .content {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .panel {
      width: min(720px, 100%);
      padding: 1.25rem;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.58);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 .5rem;
      font-size: clamp(2rem, 7vw, 5rem);
      letter-spacing: -.05em;
      text-transform: lowercase;
    }

    p {
      margin: 0;
      opacity: .72;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <main class="content">
    <section class="panel">
      <h1>learn to swim</h1>
      <p>Procedural canvas background. Change the CONFIG object to generate a new visual system.</p>
    </section>
  </main>

  <script>
    const CONFIG = {
      seed: 14291,
      density: 0.35,
      glitchAmount: 0.55,
      speed: 0.8,
      pixelScale: 4,
      glyphDensity: 0.25,
      scanlineSpacing: 3,
      maxHorizontalShift: 24,
      maxTearHeight: 5,
      glyphs: '01<>[]{}:/\\\\|+-アイウエオ░▒▓',
      background: '#050505',
      foregroundRGB: [220, 220, 220],
    };

    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d', {
      alpha: false,
      willReadFrequently: true
    });

    let animationFrame = null;
    let startTime = performance.now();

    function hash(n) {
      n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
      n = Math.imul(n ^ (n >>> 16), 0x45d9f3b);
      return (n ^ (n >>> 16)) >>> 0;
    }

    function rand(seed, i) {
      return hash(seed + i * 374761393) / 4294967295;
    }

    function resize() {
      const scale = Math.max(1, CONFIG.pixelScale);
      canvas.width = Math.max(80, Math.floor(window.innerWidth / scale));
      canvas.height = Math.max(60, Math.floor(window.innerHeight / scale));
    }

    function draw(timestamp) {
      const {
        seed,
        density,
        glitchAmount,
        speed,
        glyphDensity,
        scanlineSpacing,
        maxHorizontalShift,
        maxTearHeight,
        glyphs,
        background,
      } = CONFIG;

      const t = ((timestamp - startTime) / 1000) * speed;
      const w = canvas.width;
      const h = canvas.height;

      ctx.fillStyle = background;
      ctx.fillRect(0, 0, w, h);

      drawNoise(w, h, t, seed, density);
      drawGlyphs(w, h, t, seed, density, glitchAmount, glyphDensity, glyphs);
      drawTears(w, h, t, seed, glitchAmount, maxHorizontalShift, maxTearHeight);
      drawScanlines(w, h, scanlineSpacing);

      animationFrame = requestAnimationFrame(draw);
    }

    function drawNoise(w, h, t, seed, density) {
      const cells = Math.floor(w * h * density * 0.055);

      for (let i = 0; i < cells; i++) {
        const r1 = rand(seed, i * 5 + 1);
        const r2 = rand(seed, i * 5 + 2);
        const r3 = rand(seed, i * 5 + 3);
        const phase = Math.sin(t * (0.5 + r3 * 3) + r1 * 12);
        const x = Math.floor(r1 * w);
        const y = Math.floor(r2 * h);
        const brightness = 70 + Math.floor((phase * 0.5 + 0.5) * 160);
        const alpha = 0.12 + rand(seed, i * 5 + 4) * 0.55;

        ctx.fillStyle = `rgba(${brightness},${brightness},${brightness},${alpha})`;
        ctx.fillRect(
          x,
          y,
          1 + Math.floor(rand(seed, i * 5 + 5) * 3),
          1
        );
      }
    }

    function drawGlyphs(
      w,
      h,
      t,
      seed,
      density,
      glitchAmount,
      glyphDensity,
      glyphs
    ) {
      ctx.font = '5px monospace';
      ctx.textBaseline = 'top';

      const glyphCount = Math.floor(w * density * glyphDensity);

      for (let i = 0; i < glyphCount; i++) {
        const x = Math.floor(rand(seed + 33, i * 3) * w);
        const y = Math.floor(rand(seed + 77, i * 3 + 1) * h);
        const idx = Math.floor(
          rand(seed + Math.floor(t * 3), i * 3 + 2) * glyphs.length
        );

        ctx.fillStyle = `rgba(220,220,220,${0.08 + glitchAmount * 0.55})`;
        ctx.fillText(glyphs[idx], x, y);
      }
    }

    function drawTears(
      w,
      h,
      t,
      seed,
      glitchAmount,
      maxHorizontalShift,
      maxTearHeight
    ) {
      const tearCount = Math.floor(glitchAmount * 8);

      for (let i = 0; i < tearCount; i++) {
        const y = Math.floor(
          rand(seed + Math.floor(t * 7), i + 900) * h
        );

        const bandHeight =
          1 + Math.floor(rand(seed, i + 1200) * maxTearHeight);

        const shift = Math.floor(
          (rand(seed + Math.floor(t * 11), i + 1500) - 0.5) *
          maxHorizontalShift *
          glitchAmount
        );

        if (shift === 0 || y >= h) continue;

        const safeHeight = Math.min(bandHeight, h - y);
        if (safeHeight <= 0) continue;

        const strip = ctx.getImageData(0, y, w, safeHeight);
        ctx.putImageData(strip, shift, y);
      }
    }

    function drawScanlines(w, h, spacing) {
      ctx.fillStyle = 'rgba(255,255,255,0.03)';

      for (let y = 0; y < h; y += spacing) {
        ctx.fillRect(0, y, w, 1);
      }
    }

    function start() {
      resize();

      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
      }

      startTime = performance.now();
      animationFrame = requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (animationFrame) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
      } else if (!animationFrame) {
        startTime = performance.now();
        animationFrame = requestAnimationFrame(draw);
      }
    });

    start();
  </script>
</body>
</html>
